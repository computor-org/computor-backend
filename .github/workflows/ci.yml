name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project computor-backend --python 3.12 --frozen --extra dev
      - name: Behavioral unit tests
        run: >-
          uv run --project computor-backend --python 3.12 pytest -q
          computor-backend/src/computor_backend/tests/test_canonical_zip_hash.py
          computor-backend/src/computor_backend/tests/test_coder_image_cleanup.py
          computor-backend/src/computor_backend/tests/test_coder_source_repo_pinning.py
          computor-backend/src/computor_backend/tests/test_password_hashing.py
          computor-backend/src/computor_backend/tests/test_version_constraints.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: computor-web/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
