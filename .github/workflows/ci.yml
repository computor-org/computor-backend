name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  backend:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv lock --project computor-backend --check
      - run: uv sync --project computor-backend --python 3.12 --locked --extra dev
      - name: Behavioral unit tests
        env:
          # Coder settings validate these at import; dummy values suffice here.
          CODER_ADMIN_EMAIL: ci@example.org
          CODER_ADMIN_PASSWORD: ci-dummy-password
        run: >-
          uv run --project computor-backend --python 3.12 pytest -q
          computor-backend/src/computor_backend/tests/test_canonical_zip_hash.py
          computor-backend/src/computor_backend/tests/test_temporal_client.py
          computor-backend/src/computor_backend/tests/test_plain_mentions.py
          computor-backend/src/computor_backend/tests/test_coder_forwardauth.py
          computor-backend/src/computor_backend/tests/test_coder_provision_errors.py
          computor-backend/src/computor_backend/tests/test_coder_image_cleanup.py
          computor-backend/src/computor_backend/tests/test_coder_hostops.py
          computor-backend/src/computor_backend/tests/test_coder_worker_docker_compose.py
          computor-backend/src/computor_backend/tests/test_worker_privileges.py
          computor-backend/src/computor_backend/tests/test_rollout_history_secrets.py
          computor-backend/src/computor_backend/tests/test_terms_notice.py
          computor-backend/src/computor_backend/tests/test_temporal_exec_namespaces.py
          computor-backend/src/computor_backend/tests/test_workspace_volumes.py
          computor-backend/src/computor_backend/tests/test_workspace_slice_verification.py
          computor-backend/src/computor_backend/tests/test_coder_source_repo_pinning.py
          computor-backend/src/computor_backend/tests/test_coder_workspace_image_pinning.py
          computor-backend/src/computor_backend/tests/test_coder_template_push_deadline.py
          computor-backend/src/computor_backend/tests/test_db_dependency_lifecycle.py
          computor-backend/src/computor_backend/tests/test_keycloak_healthcheck.py
          computor-backend/src/computor_backend/tests/test_keycloak_idp_setup_retry.py
          computor-backend/src/computor_backend/tests/test_keycloak_account_console_scopes.py
          computor-backend/src/computor_backend/tests/test_keycloak_token_verification.py
          computor-backend/src/computor_backend/tests/test_keycloak_logout.py
          computor-backend/src/computor_backend/tests/test_admin_mfa.py
          computor-backend/src/computor_backend/tests/test_error_localization.py
          computor-backend/src/computor_backend/tests/test_student_testing_language.py
          computor-backend/src/computor_backend/tests/test_admin_mfa_setup.py
          computor-backend/src/computor_backend/tests/test_keycloak_abuse_setup.py
          computor-backend/src/computor_backend/tests/test_log_redaction.py
          computor-backend/src/computor_backend/tests/test_public_luna_log_privacy.py
          computor-backend/src/computor_backend/tests/test_public_luna_queue.py
          computor-backend/src/computor_backend/tests/test_password_hashing.py
          computor-backend/src/computor_backend/tests/test_public_luna_http_status.py
          computor-backend/src/computor_backend/tests/test_route_shadowing.py
          computor-backend/src/computor_backend/tests/test_sso_redirect_allowlist.py
          computor-backend/src/computor_backend/tests/test_update_keycloak_guard.py
          computor-backend/src/computor_backend/tests/test_updater_runner_persistence.py
          computor-backend/src/computor_backend/tests/test_upload_limiter.py
          computor-backend/src/computor_backend/tests/test_version_constraints.py
          computor-backend/src/computor_backend/tests/test_harness_bounds.py
          computor-backend/src/computor_backend/tests/test_compose_testing_bounds.py
          computor-backend/src/computor_backend/tests/test_workspace_launch_context.py
          computor-backend/src/computor_backend/tests/test_reading_language.py
          computor-backend/src/computor_backend/tests/test_maintenance_language.py
          computor-backend/src/computor_backend/tests/test_student_template_helpers.py
          computor-backend/src/computor_backend/tests/test_localized_titles.py
          computor-backend/src/computor_backend/tests/test_message_reading_language.py
          computor-backend/src/computor_backend/tests/test_student_description_download.py
          computor-backend/src/computor_backend/tests/test_forgejo_image_pin.py
          computor-backend/src/computor_backend/tests/test_forgejo_clone_token_persistence.py
          computor-backend/src/computor_backend/tests/test_forgejo_ensure_user.py
          computor-backend/src/computor_backend/tests/test_forgejo_naming.py
          computor-backend/src/computor_backend/tests/test_forgejo_repo_delete.py
          computor-backend/src/computor_backend/tests/test_forgejo_template_read_heal.py
          computor-backend/src/computor_backend/tests/test_forgejo_collaborator_heal.py
          computor-backend/src/computor_backend/tests/test_forgejo_handle.py
          computor-backend/src/computor_backend/tests/test_course_analytics.py
          computor-backend/src/computor_backend/tests/test_support_mail.py
          computor-backend/src/computor_backend/tests/test_issue_reports.py
          computor-backend/src/computor_backend/tests/test_approved_extension.py
          computor-backend/src/computor_backend/tests/test_workspace_extension_sync.py
          computor-backend/src/computor_backend/tests/test_workspace_language_packs.py
          computor-backend/src/computor_backend/tests/test_keycloak_locale_attribute.py
          ops/keycloak/test_locale.py
          computor-backend/src/computor_backend/tests/test_ws_profile_submission_events.py
      - name: Approved extension pin matches its GitHub release
        run: python3 ops/coder/pin-extension.py --check

  coder-worker-socket-proxy:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    # Behavioural check of the coder worker's Docker allowlist: the pinned
    # proxy image with this repo's template, probed against the runner's
    # daemon (container create/exec, pull, foreign image names -> 403).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash ops/tests/test_coder_worker_socket_proxy.sh

  workspace-git-clone:
    if: github.event_name != 'pull_request'
    # A managed-Forgejo student repository, provisioned by the backend's own
    # provider, is cloned, pushed and template-read through the
    # workspace-facing computor-git route (computor-org/issues#433).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --project computor-backend --python 3.12 --locked
      - run: bash ops/tests/test_workspace_git_clone.sh

  coder-provisioner-socket-proxy:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    # Behavioural check of the Coder server's Docker allowlist: a workspace
    # lifecycle end to end, privileged/host-bind/host-namespace creates, exec,
    # foreign images -> 403.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash ops/tests/test_coder_provisioner_socket_proxy.sh

  public-course-contract:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: computor_plan
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: computor_plan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U computor_plan -d computor_plan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: computor_plan
      POSTGRES_PASSWORD: synthetic-test-password
      POSTGRES_DB: computor_plan_test
      PUBLIC_WORKSPACE_TEST_DATABASE_URL: postgresql+psycopg2://computor_plan:synthetic-test-password@localhost:5432/computor_plan_test
      CODER_ADMIN_EMAIL: ci@example.invalid
      CODER_ADMIN_PASSWORD: synthetic-test-password
      PUBLIC_TESTING_TEST_DATABASE_URL: postgresql://computor_plan:synthetic-test-password@localhost:5432/computor_plan_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --project computor-backend --python 3.12 --locked --extra dev
      - run: uv run --project computor-backend python -m computor_backend.tests.bootstrap_public_catalog_db
      - run: >-
          uv run --project computor-backend pytest -q
          computor-backend/src/computor_backend/tests/test_public_learning.py
          computor-backend/src/computor_backend/tests/test_public_catalog_anonymous.py
          computor-backend/src/computor_backend/tests/test_public_course_registration.py
          computor-backend/src/computor_backend/tests/test_first_login_language.py
          computor-backend/src/computor_backend/tests/test_course_public_flag_authz.py
          computor-backend/src/computor_backend/tests/test_public_luna_access.py
          computor-backend/src/computor_backend/tests/test_public_testing_admission.py
          computor-backend/src/computor_backend/tests/test_public_workspace_capacity.py
          computor-backend/src/computor_backend/tests/test_admin_mfa_db.py
          computor-backend/src/computor_backend/tests/test_course_analytics_db.py
          computor-backend/src/computor_backend/tests/test_support_tickets_db.py
          computor-backend/src/computor_backend/tests/test_course_deploy_i18n.py
          computor-backend/src/computor_backend/tests/test_sync_course_metadata.py
          computor-backend/src/computor_backend/tests/test_sync_example_versions.py

  grading-isolation:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    # Hostile-snippet tests for grading jobs (#237). Sandbox-dependent cases
    # skip themselves when the runner kernel lacks Landlock ABI >= 6; limits,
    # tree kill, output caps and safe file reads run everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12 .venv-grading
      - run: >-
          VIRTUAL_ENV=.venv-grading uv pip install
          ./computor-types ./computor-testing numpy matplotlib pytest
      - name: Landlock capability
        run: .venv-grading/bin/python computor-testing/sandbox/launch.py --probe
      - name: Isolation tests
        working-directory: computor-testing
        run: >-
          ../.venv-grading/bin/python -m pytest -q -rs
          tests/test_job_isolation.py tests/test_sandbox_launch.py
          tests/test_env_filter.py
      - name: Runner message tests
        working-directory: computor-testing
        run: ../.venv-grading/bin/python -m pytest -q tests/test_i18n.py

  web:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computor-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: computor-web/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint
      - run: yarn test:public-learning
      - run: yarn build
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e e2e/public-learning.spec.ts e2e/course-card-layout.spec.ts e2e/workspace-launch.spec.ts e2e/teacher-dashboard.spec.ts e2e/support-tickets.spec.ts e2e/student-description-language.spec.ts e2e/self-enrollment-help.spec.ts e2e/public-landing.spec.ts e2e/student-progress.spec.ts e2e/reading-language-pages.spec.ts e2e/test-feedback-language.spec.ts --workers=2

  keycloak-abuse:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test Keycloak provider
        run: ops/keycloak/build_abuse.sh /tmp/computor-keycloak-providers
      - name: Pull isolated Keycloak/Postgres test images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull postgres:16.15
      - name: Exercise signup and recovery on isolated Keycloak/Postgres
        run: python3 ops/keycloak/test_abuse_live.py --provider /tmp/computor-keycloak-providers/computor-keycloak-abuse.jar

  keycloak-admin-mfa:
    # Required jobs run in the merge queue, not on pull request events.
    if: github.event_name != 'pull_request'
    # Mandatory admin TOTP (issues#485) against a real Keycloak: flows, OTP,
    # e-mail reset, backend role sync and the backend's amr evidence check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --project computor-backend --python 3.12 --locked --extra dev
      - run: docker pull quay.io/keycloak/keycloak:26.7.4
      - env:
          CODER_ADMIN_EMAIL: ci@example.invalid
          CODER_ADMIN_PASSWORD: synthetic-test-password
        run: uv run --project computor-backend python ops/keycloak/test_mfa_live.py

  # The single required check. On pull requests the jobs above are skipped and
  # this passes; in the merge queue it fails unless every job succeeded.
  ci-gate:
    if: always()
    needs: [backend, coder-worker-socket-proxy, coder-provisioner-socket-proxy, workspace-git-clone, public-course-contract, grading-isolation, web, keycloak-abuse, keycloak-admin-mfa]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
