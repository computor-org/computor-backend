[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computor-backend"
version = "0.1.0"
description = "Backend API and services for Computor platform"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Maximilian Mandlez", email = "maximilian.mandlez@tugraz.at"},
]
keywords = ["computor", "backend", "api", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Local packages (not on PyPI). In Docker they are installed from sibling
    # paths in the same pip invocation as this package (docker/base/Dockerfile),
    # so these bare-name requirements resolve locally; the backend also imports
    # computor_client (Temporal testing tasks). A standalone
    # `pip install ./computor-backend` requires the siblings installed first.
    "computor-types",
    "computor-client",

    # External dependencies
    "openpyxl==3.1.5",
    "python-gitlab==8.5.0",
    "pydantic==2.13.5",
    "pydantic-settings>=2.0.0",
    "pydantic_yaml==1.7.0",
    "PyYAML==6.0.3",
    "email-validator==2.3.0",
    "lz4==4.4.5",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "text-unidecode==1.3",
    "docker==7.2.0",
    "junit-xml==1.9",
    "psycopg2-binary==2.9.13",
    "keycove==0.3.5",
    "argon2-cffi>=23.1.0",  # Secure password hashing (Argon2id)
    "fastapi==0.141.1",
    "sqlalchemy_utils==0.42.1",
    "click==8.5.0",
    "alive-progress==3.3.0",
    "gitpython==3.1.62",
    "redis==8.1.0",
    "SQLAlchemy==2.0.54",
    "minio==7.2.20",
    "alembic==1.20.0",
    "Faker==40.39.0",
    "dotenv==0.9.9",
    "pytest==9.1.1",
    "pytest-env==1.1.5",
    "pytest-asyncio==1.4.0",
    "temporalio==1.33.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "python-multipart>=0.0.22",
    "Pyro5==5.17",
    "uvicorn[standard]==0.54.0",
    "slowapi==0.1.10",
    "python-hcl2==8.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/computor-org/computor-backend"
Documentation = "https://github.com/computor-org/computor-backend/tree/main/docs"
Repository = "https://github.com/computor-org/computor-backend"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# Installed only into the testing worker image (docker/temporal-worker-testing),
# so computor-testing's dependencies are resolved and hash-locked together with
# the backend's in uv.lock instead of floating on its version ranges.
testing-worker = ["computor-testing"]

[tool.uv]
# Supply-chain cooldown: resolve only releases uploaded before this instant.
# Refresh = move it to "now minus 7 days" and relock, e.g.
#   sed -i "s/^exclude-newer = .*/exclude-newer = \"$(date -u -d '7 days ago' +%FT%TZ)\"/" pyproject.toml
#   uv lock --upgrade && uv lock --check
# A security fix newer than the cutoff is taken per package with
# exclude-newer-package, and named in the PR.
exclude-newer = "2026-09-22T14:13:07Z"

[tool.uv.sources]
computor-client = { path = "../computor-client" }
computor-types = { path = "../computor-types" }
computor-testing = { path = "../computor-testing" }
