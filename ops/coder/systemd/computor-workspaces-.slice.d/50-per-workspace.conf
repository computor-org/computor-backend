# Per-workspace process limit for Coder workspace containers.
#
# The workspace templates put each workspace in its own child slice,
# computor-workspaces-<workspace id>.slice, below the aggregate
# computor-workspaces.slice. systemd applies drop-ins in this prefix directory
# to every such child, but not to the aggregate itself, so each workspace gets
# its own TasksMax (pids.max: processes plus threads) and the aggregate
# TasksMax still bounds their sum.
#
# The Docker Terraform provider has no pids_limit, so this is the
# per-workspace fork-bomb bound. Measured peak task counts: idle VS Code
# workspace 40-54; code-server with an open browser session about 110;
# multiprocessing.Pool() plus NumPy on a 32-CPU host 1096 (each worker starts
# one BLAS thread per CPU, so the count grows with the host's CPU count
# squared, about 1700 on a 40-CPU host).
#
# Install on the worker host next to computor-workspaces.slice:
#   sudo install -d /etc/systemd/system/computor-workspaces-.slice.d
#   sudo install -m 0644 50-per-workspace.conf /etc/systemd/system/computor-workspaces-.slice.d/
#   sudo systemctl daemon-reload
# Running workspaces keep their old cgroup until they restart.
[Slice]
TasksAccounting=yes
TasksMax=4096
