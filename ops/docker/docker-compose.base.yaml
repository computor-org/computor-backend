# Base Docker Compose configuration
# Contains shared services, networks, and volumes used by all deployments
# This file should be used together with environment-specific overrides

# Project name: prefixes every auto-named container (services without an explicit
# container_name, e.g. the replica-scaled workers) as `computor-<service>-<n>`.
# Without it, Compose falls back to the basename of the compose-file directory
# (`ops/docker`) and you get `docker-<service>-<n>`. Base is always the first
# `-f` file assembled by computor.sh, so declaring it here covers the whole stack.
name: computor

# Services that pin an explicit container_name spell it
# `${CONTAINER_NAME_PREFIX:-computor-}<service>`. The `computor-` belongs in the
# DEFAULT, never in the literal after it: previewctl sets the variable to its own
# prefix to run a second stack beside production, and unset must reproduce the
# production names byte for byte. Writing `${CONTAINER_NAME_PREFIX:-}computor-x`
# looks equivalent but yields `preview-computor-x` under previewctl; writing
# `${CONTAINER_NAME_PREFIX:-}x` silently drops the prefix off production, which
# is what broke Coder in b9339eba.

networks:
  computor-network:
    name: ${COMPOSE_NETWORK_NAME:-computor-network}
    driver: bridge

services:
  # Single Traefik instance for all routing.
  # Docker-provider command flags and socket access live in dev/prod overlays:
  # dev mounts the socket directly; prod proxies it via tecnativa/docker-socket-proxy.
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    ports:
      # Bind to loopback by default: a co-located nginx terminates TLS and reaches
      # Traefik via 127.0.0.1:8080. This prevents clients from hitting Traefik
      # directly over plain HTTP and bypassing TLS. Set TRAEFIK_BIND_ADDRESS=0.0.0.0
      # only if nginx runs on a different host — and firewall 8080 to that host.
      - "${TRAEFIK_HTTP_BIND:-${TRAEFIK_BIND_ADDRESS:-127.0.0.1}}:${TRAEFIK_HTTP_PORT:-8080}:80"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - "traefik.enable=false"  # Traefik itself doesn't need to be routed

  # PostgreSQL with multiple databases support
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-5432}:5437"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/postgres:/var/lib/postgresql/data
      - ../../docker/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: 5437
      # Additional databases for Coder (created via init script if CODER_ENABLED=true)
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-computor}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5437"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: "redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    # The password reaches redis through a private config file written from the
    # environment, never through the command line (visible in ps / inspect Cmd).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Atomically replace the file on restart: Redis owns the previous 0600 file,
    # so Linux protected_regular prevents root from reopening it in /tmp.
    # The image's own entrypoint still drops to the redis user.
    entrypoint:
      - sh
      - -c
      - umask 077 && auth_config=$$(mktemp /tmp/redis-auth.XXXXXX) && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > "$$auth_config" && chown redis "$$auth_config" && mv -f "$$auth_config" /tmp/redis-auth.conf && unset REDIS_PASSWORD && exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --save 20 1 --loglevel warning
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/redis:/usr/local/etc/redis
      - ${SYSTEM_DEPLOYMENT_PATH}/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal PostgreSQL database
  temporal-postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}temporal-postgres
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${TEMPORAL_POSTGRES_PORT:-5433}:5433"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/temporal-postgres:/var/lib/postgresql/data
    environment:
      TZ: UTC
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?must be set in .env}
      POSTGRES_DB: temporal
      PGPORT: 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal server
  temporal:
    image: temporalio/auto-setup:1.29.3@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}temporal
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${TEMPORAL_EXTERNAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5433
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:?must be set in .env}
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig.yaml
    volumes:
      - ../../docker/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
    depends_on:
      temporal-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  # One-shot, idempotent: the Chainguard MinIO image runs as uid 65532, while
  # data written by the old minio/minio image (root) is root-owned. Chowns
  # /data once (top level last, so an interrupted run is simply repeated) and
  # is a no-op afterwards. Same pinned image, run as root, only for chown.
  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    security_opt:
      - "no-new-privileges:true"
    network_mode: none
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}minio-init
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ "$$(stat -c %u:%g /data)" = 65532:65532 ]; then
          echo "minio-init: /data ownership ok"
          exit 0
        fi
        for p in /data/* /data/.[!.]* /data/..?*; do
          [ -e "$$p" ] || [ -L "$$p" ] || continue
          if ! chown -R 65532:65532 "$$p"; then
            echo "minio-init: chown failed for $$p; /data left unmarked" >&2
            exit 1
          fi
        done
        # The parent is the "done" marker: only after every child succeeded.
        chown 65532:65532 /data
        echo "minio-init: /data chowned to 65532:65532"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/minio/data:/data
    restart: "no"

  minio:
    # minio/minio images are no longer published (Docker Hub/quay). Chainguard's
    # build, pinned by digest; signature verified with cosign against
    # github.com/chainguard-images/images. Runs as uid 65532 (see minio-init);
    # entrypoint is the minio binary, so `command` is unchanged. `mc` ships in
    # the image, so the `mc ready local` healthcheck keeps working.
    image: cgr.dev/chainguard/minio:latest@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}minio
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/minio/data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-computor-storage}
    command: server /data --console-address ":9001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  # Static file server — read-only view of the documents tree maintained by
  # the /documents API. Both must point at the same host directory.
  #
  # This container has no authentication of its own, so /docs is gated by a
  # ForwardAuth to the backend. Without it the whole tree was readable — and
  # listable, SHOW_LISTING is on — by anyone who could reach Traefik, with no
  # login. The gate requires an authenticated user and nothing more, matching
  # the read policy GET /documents/{list,files} already enforce; writes stay
  # scope-checked in the API. Workspaces cannot reach this at all: they are
  # behind workspace-ingress, whose allowlist covers only the API and git.
  static-server:
    image: halverneus/static-file-server:v1.8.12@sha256:48c3f4139614c377ad9f29273c465c04671a338a296d40e0ebee626178800072
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - computor-network
    restart: unless-stopped
    volumes:
      - ${DOCUMENTS_HOST_ROOT:-${SYSTEM_DEPLOYMENT_PATH}/shared/documents}:/web:ro
    environment:
      - FOLDER=/web
      - PORT=8080
      - SHOW_LISTING=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=PathPrefix(`/docs`)"
      - "traefik.http.routers.static.entrypoints=web"
      # API_URL is the backend as a container reaches it (dev: the host-run
      # backend, prod: the uvicorn container) — set per environment by
      # setup-env.sh, which is exactly what Traefik needs here.
      - "traefik.http.middlewares.static-auth.forwardauth.address=${API_URL:-http://uvicorn:8000}/auth/verify-documents-access"
      - "traefik.http.middlewares.static-stripprefix.stripprefix.prefixes=/docs"
      # Auth first, then strip — same chain order as the workspace routers.
      - "traefik.http.routers.static.middlewares=static-auth,static-stripprefix"
      - "traefik.http.services.static.loadbalancer.server.port=8080"
    depends_on:
      - traefik
