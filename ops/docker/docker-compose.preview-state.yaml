# Preview state services. This file is included only by previewctl; it is
# deliberately not part of the production startup path.

services:
  keycloak-db:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}keycloak-db
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${PREVIEW_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_DB_PORT:-5434}:5438"
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/keycloak-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?must be set in .env.preview}
      POSTGRES_DB: keycloak
      PGPORT: 5438
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -p 5438"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}keycloak
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?must be set in .env.preview}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5438/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?must be set in .env.preview}
      KC_HOSTNAME_STRICT: "false"
      # Pin the externally visible HTTP origin for LAN previews. Without an
      # explicit origin Keycloak treats a non-local Host header as HTTPS-only.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME must be set in .env.preview}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
    # The API initializes its OIDC plugin during startup.  Waiting only for
    # the Keycloak container process races the realm import and leaves a
    # permanently uninitialized login provider, even though /docs is healthy.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r s <&3; case "$${s%$$(printf "\r")}" in "HTTP/1."?" 200"|"HTTP/1."?" 200 "*) exit 0;; esac; exit 1'
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30
    ports:
      - "${PREVIEW_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ${KEYCLOAK_IMPORT_ROOT:?KEYCLOAK_IMPORT_ROOT must be set}:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  preview-seed:
    image: ${PREVIEW_IMAGE_PREFIX:-computor}-uvicorn
    networks:
      - computor-network
    container_name: ${CONTAINER_NAME_PREFIX:-computor-}preview-seed
    restart: "no"
    security_opt:
      - "no-new-privileges:true"
    env_file:
      - ${PREVIEW_ENV_FILE:?PREVIEW_ENV_FILE must be set}
    environment:
      PYTHONPATH: /home/worker/computor-backend/src
    command: ["python", "-m", "computor_backend.scripts.preview_seed"]
    depends_on:
      uvicorn:
        condition: service_healthy
    volumes:
      - ${SYSTEM_DEPLOYMENT_PATH}/shared:${API_ROOT_PATH}/shared
    labels:
      - "traefik.enable=false"

  uvicorn:
    depends_on:
      keycloak:
        condition: service_healthy
