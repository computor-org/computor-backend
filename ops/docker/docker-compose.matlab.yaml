# MATLAB Testing Worker — optional add-on stack
# Include when MATLAB_ENABLED=true. computor.sh adds this file automatically.
#
# Required .env additions when enabling MATLAB:
#   MATLAB_ENABLED=true
#   MATLAB_TESTING_WORKER_REPLICAS=1
#   MATLAB_WORKER_TOKEN=<generate with: openssl rand -hex 32>
#   MATLAB_TEST_ENGINE_URL=
#   MATLAB_TEST_ENGINE_TOKEN=
#   MATLAB_TEST_ENGINE_VERSION=latest
#   MATLAB_MLM_LICENSE_FILE=
#
# MATLAB_BASE_IMAGE is optional: computor.sh defaults it to a tag it builds
# itself from docker/matlab/Dockerfile (see assemble_compose_files in
# ops/lib/common.sh). Set it in .env only to use a prebuilt/registry image.

services:
  temporal-worker-matlab:
    build:
      context: ../../
      dockerfile: ./docker/temporal-worker-matlab/Dockerfile
      args:
        # computor.sh always exports this; the guard is for a raw `docker compose`.
        MATLAB_BASE_IMAGE: ${MATLAB_BASE_IMAGE:?set by ./computor.sh — start the stack with it, or set MATLAB_BASE_IMAGE in .env}
    networks:
      - computor-network
    restart: unless-stopped
    # Must be >= TEMPORAL_GRACEFUL_SHUTDOWN_SECONDS (default 300s), or Docker
    # SIGKILLs the worker while it is still draining a live run.
    stop_grace_period: 330s
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["--queues=testing-matlab"]
    init: true
    deploy:
      replicas: ${MATLAB_TESTING_WORKER_REPLICAS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=UTC
      - RUNNING_IN_DOCKER=true
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      # This replica owns exactly one MATLAB engine, and MATLAB runs one command
      # at a time. Pulling more than one test activity at a time would only
      # queue them inside that engine while their timeouts count down. Scale
      # throughput with MATLAB_TESTING_WORKER_REPLICAS, not with concurrency.
      - TEMPORAL_MAX_CONCURRENT_ACTIVITIES=1
      - PYTHONPATH=/home/matlab/computor-backend/src
      - API_URL=${API_URL}
      - API_TOKEN=${MATLAB_WORKER_TOKEN:?}
      - MATLAB_TEST_ENGINE_URL=${MATLAB_TEST_ENGINE_URL}
      - MATLAB_TEST_ENGINE_TOKEN=${MATLAB_TEST_ENGINE_TOKEN}
      - MATLAB_TEST_ENGINE_VERSION=${MATLAB_TEST_ENGINE_VERSION}
      - MLM_LICENSE_FILE=${MATLAB_MLM_LICENSE_FILE}
    depends_on:
      - temporal
      - postgres
      - redis
      - minio
    ulimits:
      # NOTE: do NOT set `nproc` here. RLIMIT_NPROC is enforced per real-UID
      # *host-wide* (not per container, since there's no userns-remap), so a cap
      # of e.g. 2048 is shared with whatever else on the host runs under the same
      # UID -> fork/exec fails with EAGAIN ("resource temporarily unavailable")
      # and the container restart-loops. That bit originally with the R2024b
      # image, whose `matlab` user was UID 1000 — the same as the typical host
      # login user, whose desktop tasks exhausted the cap before the worker even
      # started. R2025b moved the user to UID 1001, so today's collision is less
      # likely, but the mechanism is unchanged and the limit is still the wrong
      # tool. Use pids_limit (cgroup pids controller, namespace-scoped) instead.
      nofile:
        soft: 8192
        hard: 16384
    pids_limit: 2048
    labels:
      - "traefik.enable=false"
