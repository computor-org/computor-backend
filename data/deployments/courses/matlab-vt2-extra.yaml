# Single-course deployment file — a top-level HierarchicalCourseConfig.
#
# This is what the web "create course" page uploads. It is POSTed to
#   POST /course-families/{course_family_id}/deploy-course
# so the course FAMILY (and therefore the organization) is chosen in the UI and
# comes from the URL — it is NOT in this file. The file describes ONLY the
# course: the required top-level keys are the COURSE's `name` and `path`, plus
# `services` (references), `content_types` and the `contents` tree. Any
# `organizations` / `course_families` / `gitlab` / `users` keys are ignored by
# the parser, so they are removed here.
#
# What changed vs. the old full-hierarchy file:
#   * The org -> course_families -> courses nesting is flattened: the single
#     course is lifted to the top level (name/path/services/content_types/contents).
#   * The organization `gitlab:` block is GONE. Git is no longer configured in a
#     deployment file. A course is bound to a git server separately, via the git
#     server registry + course git binding (see "GIT / GITLAB" note below).
#   * `services:` is now only a list of REFERENCES (slug). The MATLAB testing
#     worker's full definition (user + api_token + temporal config) is NOT a
#     course concern — it must live in its own data/deployments/*.yaml so it is
#     registered at API startup. The course just points at it by slug. Until that
#     service is registered, deploy still succeeds but assignments get no testing
#     service (a warning), so students can't run tests/submit yet.
#
# GIT / GITLAB
#   The YAML-upload path creates an UNBOUND course (identity + content only).
#   To host the course in GitLab, do it out-of-band, in two steps:
#     1. Register the GitLab instance once as a managed git server:
#          POST /git-servers  { type: gitlab, base_url: <GITLAB_URL>,
#                               managed: true, token: <group token>,
#                               parent_group_id: <GITLAB_PARENT_GROUP> }
#        (this replaces the old org-level gitlab {url, token, parent}; it is a
#         shared registry entry, not per-course).
#     2. Bind THIS course to it (lecturer): POST /courses/{id}/git-binding
#          { delivery: git, git_server_id: <id from step 1>,
#            student_repo_modes: [managed] }
#        which provisions the flat GitLab course structure (course group +
#        template/reference projects + students subgroup) under the parent group.
#        The binding locks once a template or any student repo is materialized.

# Bind the course to the in-system managed Forgejo (no credentials needed). For
# an external GitLab, replace this block per the GIT note in the header above.
git:
  delivery: git
  provider: forgejo
  student_repo_modes: [managed, download]

